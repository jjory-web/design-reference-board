<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>디자인 레퍼런스 보드</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#f3f5f9; --card:#ffffff; --ink:#172033; --muted:#7d8799;
      --line:#e4e8f0; --accent:#2748d8; --accent-soft:#eef2ff;
      --shadow:0 16px 38px rgba(19,31,54,.08); --radius-xl:22px; --radius-lg:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;
      background:
        radial-gradient(circle at top left, rgba(65,105,225,.08), transparent 22%),
        radial-gradient(circle at top right, rgba(73,101,160,.06), transparent 26%),
        var(--bg);
      color:var(--ink);
    }
    button,input,select{font:inherit}
    .wrap{max-width:1480px;margin:0 auto;padding:30px 28px 40px}
    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;
      margin-bottom:18px
    }
    .brand h1{
      margin:0;
      font-size:31px;
      font-weight:800;
      letter-spacing:-.04em
    }
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}
    .btn{
      appearance:none;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      transition:.15s ease
    }
    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 8px 18px rgba(27,39,62,.06)
    }
    .btn.primary{
      background:var(--accent);
      border-color:var(--accent);
      color:#fff
    }
    .btn.upload-btn{padding:11px 18px;min-width:110px}
    .panel{
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(10px);
      border:1px solid rgba(228,232,240,.95);
      border-radius:var(--radius-xl);
      padding:18px;
      box-shadow:var(--shadow);
      margin-bottom:18px
    }
    .composer-top{
      display:grid;
      grid-template-columns:minmax(200px,240px) auto;
      gap:12px;
      align-items:start;
      margin-bottom:14px
    }
    .name-row{
      display:flex;
      gap:6px;
      align-items:center;
      flex-wrap:nowrap;
      white-space:nowrap
    }
    .name-row select{min-width:0;flex:1}
    .name-row #addNameBtn{
      flex:0 0 auto;
      padding:8px 10px;
      font-size:13px
    }
    select{
      width:100%;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px 14px;
      background:#fff
    }
    .keyword-group{
      display:flex;
      gap:12px;
      align-items:flex-start;
      flex-wrap:wrap
    }
    .keyword-label{
      font-size:14px;
      font-weight:700;
      color:#47546b;
      padding-top:10px;
      white-space:nowrap
    }
    .tag-bar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      min-height:48px;
      flex:1
    }
    .tag-btn{
      border:1px solid var(--line);
      background:#fff;
      color:#33425f;
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      transition:.15s ease;
      font-size:14px
    }
    .tag-btn.active{
      background:var(--accent-soft);
      color:var(--accent);
      border-color:#ccd6ff;
      font-weight:700
    }
    .dropzone{
      margin-top:4px;
      border:1.5px dashed #c2cbdd;
      border-radius:18px;
      padding:40px 22px;
      text-align:center;
      background:linear-gradient(180deg,#fbfcff,#f6f8fd);
      cursor:pointer;
      transition:.18s ease
    }
    .dropzone.drag{
      border-color:var(--accent);
      background:var(--accent-soft)
    }
    .dropzone strong{
      display:block;
      font-size:19px;
      letter-spacing:-.02em;
      margin-bottom:8px
    }
    .dropzone span{
      color:var(--muted);
      font-size:13px;
      line-height:1.5
    }
    #fileInput,#cameraInput{display:none}
    .upload-actions{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:12px;
      flex-wrap:wrap
    }
    .camera-btn{
      background:#fff;
      border-color:#cbd4e4;
      color:#2d3c58
    }
    .status{
      font-size:12px;
      color:var(--muted);
      margin-top:12px
    }
    .filters{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:20px 0 18px
    }
    .pill{
      border:1px solid var(--line);
      background:#fff;
      color:#34415b;
      padding:10px 13px;
      border-radius:999px;
      cursor:pointer;
      transition:.15s ease
    }
    .pill.active{
      background:var(--ink);
      color:#fff;
      border-color:var(--ink)
    }
    .grid{
      columns:4 260px;
      column-gap:14px
    }
    .card{
      break-inside:avoid;
      margin:0 0 14px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 8px 24px rgba(18,27,45,.05)
    }
    .thumb{
      background:#eef2f8;
      position:relative;
      cursor:zoom-in
    }
    .thumb img{
      width:100%;
      height:auto;
      display:block
    }
    .meta{padding:12px 13px 13px}
    .meta-top{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:center
    }
    .who{
      font-size:13px;
      font-weight:800;
      letter-spacing:-.01em
    }
    .date{
      color:var(--muted);
      font-size:11px
    }
    .tags{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-top:9px
    }
    .tag{
      display:inline-flex;
      align-items:center;
      padding:5px 9px;
      border-radius:999px;
      background:#f1f4f9;
      color:#4f5f7a;
      font-size:11px;
      font-weight:600
    }
    .actions{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:10px
    }
    .edit-btn{
      border:0;
      background:transparent;
      color:var(--accent);
      cursor:pointer;
      font-size:12px;
      font-weight:700
    }
    .keyword-editor{
      display:none;
      margin-top:10px;
      padding:10px;
      border-radius:12px;
      background:#f7f9fc;
      border:1px solid var(--line)
    }
    .keyword-editor.open{display:block}
    .keyword-editor-title{
      font-size:11px;
      font-weight:700;
      color:#65728a;
      margin-bottom:8px
    }
    .keyword-editor-tags{
      display:flex;
      gap:6px;
      flex-wrap:wrap
    }
    .mini-tag-btn{
      border:1px solid var(--line);
      background:#fff;
      color:#4f5f7a;
      padding:6px 9px;
      border-radius:999px;
      cursor:pointer;
      font-size:11px
    }
    .mini-tag-btn.active{
      background:var(--accent-soft);
      border-color:#ccd6ff;
      color:var(--accent);
      font-weight:700
    }
    .keyword-editor-actions{
      display:flex;
      justify-content:flex-end;
      gap:6px;
      margin-top:9px
    }
    .mini-action{
      border:1px solid var(--line);
      background:#fff;
      color:#4f5f7a;
      padding:6px 9px;
      border-radius:9px;
      cursor:pointer;
      font-size:11px
    }
    .mini-action.save{
      background:var(--accent);
      border-color:var(--accent);
      color:#fff
    }
    .danger{
      border:0;
      background:transparent;
      color:#b44747;
      cursor:pointer;
      font-size:12px
    }
    .empty{
      padding:58px 24px;
      text-align:center;
      color:var(--muted);
      border:1px dashed var(--line);
      border-radius:18px;
      background:#fff;
      box-shadow:0 6px 18px rgba(18,27,45,.04)
    }
    .modal{
      display:none;
      position:fixed;
      inset:0;
      z-index:50;
      background:rgba(8,12,22,.82);
      align-items:center;
      justify-content:center;
      padding:26px
    }
    .modal.open{display:flex}
    .modal img{
      max-width:94vw;
      max-height:88vh;
      border-radius:16px;
      box-shadow:0 24px 70px rgba(0,0,0,.38)
    }
    .close{
      position:fixed;
      top:18px;
      right:20px;
      border:0;
      background:none;
      color:#fff;
      font-size:32px;
      cursor:pointer
    }

    @media (max-width:960px){
      .wrap{padding:20px 16px 28px}
      header{align-items:flex-start;flex-direction:column}
      .composer-top{grid-template-columns:1fr}
      .grid{columns:3 220px}
      .keyword-group{flex-direction:column;gap:8px}
      .keyword-label{padding-top:0}
    }

    @media (max-width:680px){
      .grid{columns:2 160px}
      .name-row{flex-wrap:nowrap}
      .name-row #addNameBtn{padding:7px 9px;font-size:12px}
      .upload-actions{justify-content:stretch}
      .upload-actions .btn{width:100%}
    }
  </style>
</head>

<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>디자인 레퍼런스 보드</h1>
    </div>

    <div class="toolbar">
      <button class="btn" id="refreshBtn">새로고침</button>
    </div>
  </header>

  <section class="panel">

    <div class="composer-top">

      <div class="name-row">
        <select id="uploader"></select>
        <button class="btn" id="addNameBtn" type="button">+ 추가</button>
      </div>

      <div class="keyword-group">
        <div class="keyword-label">키워드:</div>
        <div class="tag-bar" id="tagBar"></div>
      </div>

    </div>

    <div class="dropzone" id="dropzone" tabindex="0">
      <strong>이미지를 여기에 붙여넣거나 드래그해 주세요.</strong>
      <span>Ctrl + V / Drag & Drop / 파일 선택 모두 가능합니다.</span>
    </div>

    <div class="upload-actions">
      <button class="btn camera-btn" id="cameraBtn" type="button">
        사진 찍기
      </button>

      <button class="btn primary upload-btn" id="uploadBtn" type="button">
        업로드
      </button>
    </div>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
      multiple
    />

    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
    />

    <div class="status" id="status">준비됨</div>

  </section>

  <div class="filters" id="filters"></div>

  <main id="grid" class="grid"></main>

</div>

<div class="modal" id="modal">
  <button class="close" id="modalClose" aria-label="닫기">×</button>
  <img id="modalImg" alt="확대 이미지" />
</div>

<script>

const SUPABASE_URL =
  "https://yzpzlmdomumwkxvqsrej.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_UrMeZo9eZio8J4G2-EiUPQ_w8SWlr-i";

const BUCKET = "reference-images";
const TABLE = "references";

const TAG_OPTIONS = [
  "표지",
  "책등",
  "내지",
  "일러스트",
  "기타"
];

const NAME_STORAGE_KEY =
  "reference_board_names_v1";

const DEFAULT_NAMES = ["정은"];

let selectedTags = [];
let activeFilter = "전체";
let cache = [];
let pendingFiles = [];

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

const el = id =>
  document.getElementById(id);

const grid = el("grid");
const dropzone = el("dropzone");
const fileInput = el("fileInput");
const cameraInput = el("cameraInput");
const statusEl = el("status");

function escapeHtml(s=""){
  return s.replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
}

function setStatus(msg){
  statusEl.textContent = msg;
}

function getNames(){

  try{

    const raw =
      localStorage.getItem(
        NAME_STORAGE_KEY
      );

    const parsed =
      raw
      ? JSON.parse(raw)
      : DEFAULT_NAMES;

    const unique =
      [...new Set(
        (parsed || [])
        .map(x => (x || "").trim())
        .filter(Boolean)
      )];

    return unique.length
      ? unique
      : DEFAULT_NAMES;

  }catch(e){

    return DEFAULT_NAMES;

  }
}

function saveNames(names){

  localStorage.setItem(
    NAME_STORAGE_KEY,
    JSON.stringify(names)
  );

}

function renderNameOptions(){

  const names = getNames();

  const current =
    el("uploader").value ||
    names[0];

  el("uploader").innerHTML =
    names.map(name => `
      <option value="${escapeHtml(name)}">
        ${escapeHtml(name)}
      </option>
    `).join("");

  if(names.includes(current)){
    el("uploader").value =
      current;
  }

}

function addName(){

  const name =
    prompt(
      "추가할 이름을 입력해 주세요."
    );

  if(!name) return;

  const trimmed =
    name.trim();

  if(!trimmed) return;

  const names =
    getNames();

  if(!names.includes(trimmed)){
    names.push(trimmed);
  }

  saveNames(names);

  renderNameOptions();

  el("uploader").value =
    trimmed;

  renderFilters();

}

function renderTagButtons(){

  const tagBar =
    el("tagBar");

  tagBar.innerHTML =
    TAG_OPTIONS.map(tag => `
      <button
        class="tag-btn ${
          selectedTags.includes(tag)
          ? "active"
          : ""
        }"
        type="button"
        data-tag="${tag}"
      >
        ${tag}
      </button>
    `).join("");

}

function toggleTag(tag){

  if(selectedTags.includes(tag)){

    selectedTags =
      selectedTags.filter(
        t => t !== tag
      );

  }else{

    selectedTags.push(tag);

  }

  renderTagButtons();

}

function renderFilters(){

  const names =
    getNames();

  const items =
    ["전체", ...names];

  const wrap =
    el("filters");

  wrap.innerHTML =
    items.map(name => `
      <button
        class="pill ${
          activeFilter === name
          ? "active"
          : ""
        }"
        data-filter="${name}"
      >
        ${name}
      </button>
    `).join("");

}

function currentMeta(){

  return {
    uploader:
      el("uploader").value,
    tags:
      [...selectedTags]
  };

}

async function loadItems(){

  setStatus(
    "불러오는 중..."
  );

  const {
    data,
    error
  } =
    await sb
      .from(TABLE)
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){

    console.error(error);

    grid.innerHTML = `
      <div class="empty">
        목록을 불러오지 못했습니다.
      </div>
    `;

    setStatus(
      "불러오기 오류"
    );

    return;

  }

  cache =
    data || [];

  render();

  setStatus(
    `${cache.length}개 레퍼런스`
  );

}

function render(){

  const items =
    activeFilter === "전체"
    ? cache
    : cache.filter(
        x =>
          x.uploader ===
          activeFilter
      );

  if(!items.length){

    grid.innerHTML = `
      <div class="empty">
        아직 이미지가 없습니다.
      </div>
    `;

    return;

  }

  grid.innerHTML =
    items.map(item => {

      const date =
        item.created_at
        ? new Date(
            item.created_at
          ).toLocaleDateString(
            "ko-KR"
          )
        : "";

      const itemTags =
        item.tags || [];

      const tags =
        itemTags
          .map(
            t =>
              `<span class="tag">${escapeHtml(t)}</span>`
          )
          .join("");

      const editorButtons =
        TAG_OPTIONS
          .map(t => `
            <button
              type="button"
              class="mini-tag-btn ${
                itemTags.includes(t)
                ? "active"
                : ""
              }"
              data-tag="${t}"
              onclick="toggleCardTag(this)"
            >
              ${t}
            </button>
          `)
          .join("");

      return `
        <article
          class="card"
          data-id="${item.id}"
        >

          <div
            class="thumb"
            onclick="openModal('${item.image_url.replace(/'/g,"\\'")}')"
          >
            <img
              src="${item.image_url}"
              alt="reference image"
              loading="lazy"
            />
          </div>

          <div class="meta">

            <div class="meta-top">

              <span class="who">
                ${escapeHtml(item.uploader || "")}
              </span>

              <span class="date">
                ${date}
              </span>

            </div>

            <div
              class="tags"
              data-role="display-tags"
            >
              ${tags}
            </div>

            <div
              class="keyword-editor"
              data-role="keyword-editor"
            >

              <div
                class="keyword-editor-title"
              >
                키워드 수정
              </div>

              <div
                class="keyword-editor-tags"
              >
                ${editorButtons}
              </div>

              <div
                class="keyword-editor-actions"
              >

                <button
                  type="button"
                  class="mini-action"
                  onclick="closeKeywordEditor(this)"
                >
                  취소
                </button>

                <button
                  type="button"
                  class="mini-action save"
                  onclick="saveKeywords(this,'${item.id}')"
                >
                  저장
                </button>

              </div>

            </div>

            <div class="actions">

              <button
                class="edit-btn"
                onclick="openKeywordEditor(this)"
              >
                키워드 수정
              </button>

              <button
                class="danger"
                onclick="removeItem(
                  '${item.id}',
                  '${item.storage_path.replace(/'/g,"\\'")}'
                )"
              >
                삭제
              </button>

            </div>

          </div>

        </article>
      `;

    }).join("");

}

async function compressImage(file){

  if(
    !file ||
    !file.type.startsWith("image/")
  ){
    return file;
  }

  if(
    file.type === "image/gif" ||
    file.type === "image/svg+xml"
  ){
    return file;
  }

  const MAX_SIDE = 1600;
  const QUALITY = 0.82;

  try{

    const bitmap =
      await createImageBitmap(file);

    const scale =
      Math.min(
        1,
        MAX_SIDE /
        Math.max(
          bitmap.width,
          bitmap.height
        )
      );

    const width =
      Math.max(
        1,
        Math.round(
          bitmap.width *
          scale
        )
      );

    const height =
      Math.max(
        1,
        Math.round(
          bitmap.height *
          scale
        )
      );

    const canvas =
      document.createElement(
        "canvas"
      );

    canvas.width =
      width;

    canvas.height =
      height;

    const ctx =
      canvas.getContext(
        "2d",
        {alpha:false}
      );

    ctx.drawImage(
      bitmap,
      0,
      0,
      width,
      height
    );

    bitmap.close?.();

    const blob =
      await new Promise(
        resolve =>
          canvas.toBlob(
            resolve,
            "image/webp",
            QUALITY
          )
      );

    if(!blob){
      return file;
    }

    if(
      blob.size >= file.size &&
      scale === 1
    ){
      return file;
    }

    const base =
      (
        file.name ||
        "image"
      ).replace(
        /\.[^.]+$/,
        ""
      );

    return new File(
      [blob],
      `${base}.webp`,
      {
        type:"image/webp",
        lastModified:Date.now()
      }
    );

  }catch(err){

    console.warn(
      "이미지 압축을 건너뜁니다.",
      err
    );

    return file;

  }

}

async function uploadFiles(files){

  if(!files?.length){
    return;
  }

  let completed = 0;

  for(
    const originalFile
    of files
  ){

    if(
      !originalFile.type
        .startsWith("image/")
    ){
      continue;
    }

    setStatus(
      `${
        originalFile.name ||
        "이미지"
      } 압축 중...`
    );

    const file =
      await compressImage(
        originalFile
      );

    const savedPct =
      originalFile.size
      ? Math.max(
          0,
          Math.round(
            (
              1 -
              file.size /
              originalFile.size
            ) *
            100
          )
        )
      : 0;

    setStatus(
      `${
        originalFile.name ||
        "이미지"
      } 업로드 중${
        savedPct
        ? ` · ${savedPct}% 절약`
        : ""
      }...`
    );

    const ext =
      (
        file.name
          ?.split(".")
          .pop() ||
        file.type
          .split("/")[1] ||
        "webp"
      ).replace(
        /[^a-z0-9]/gi,
        ""
      );

    const path =
      `${Date.now()}-${crypto.randomUUID()}.${ext}`;

    const {
      error:uploadError
    } =
      await sb.storage
        .from(BUCKET)
        .upload(
          path,
          file,
          {
            contentType:file.type,
            upsert:false
          }
        );

    if(uploadError){

      console.error(
        uploadError
      );

      setStatus(
        "이미지 업로드 오류"
      );

      continue;

    }

    const {
      data:pub
    } =
      sb.storage
        .from(BUCKET)
        .getPublicUrl(
          path
        );

    const meta =
      currentMeta();

    const {
      error:dbError
    } =
      await sb
        .from(TABLE)
        .insert({

          uploader:
            meta.uploader,

          tags:
            meta.tags,

          memo:"",

          image_url:
            pub.publicUrl,

          storage_path:
            path

        });

    if(dbError){

      console.error(
        dbError
      );

      setStatus(
        "정보 저장 오류"
      );

      continue;

    }

    completed++;

  }

  selectedTags = [];

  renderTagButtons();

  pendingFiles = [];

  fileInput.value = "";

  cameraInput.value = "";

  await loadItems();

  if(completed){

    setStatus(
      `${completed}개 이미지 업로드 완료 · 자동 압축 적용`
    );

  }

}

window.removeItem =
async function(
  id,
  path
){

  if(
    !confirm(
      "이 이미지를 삭제할까요?"
    )
  ){
    return;
  }

  const {
    error:dbError
  } =
    await sb
      .from(TABLE)
      .delete()
      .eq(
        "id",
        id
      );

  if(dbError){

    alert(
      "삭제에 실패했습니다."
    );

    return;

  }

  if(path){

    await sb.storage
      .from(BUCKET)
      .remove([path]);

  }

  await loadItems();

};

window.openKeywordEditor =
function(btn){

  const card =
    btn.closest(".card");

  card
    .querySelector(
      '[data-role="keyword-editor"]'
    )
    .classList
    .add("open");

};

window.closeKeywordEditor =
function(btn){

  const editor =
    btn.closest(
      '[data-role="keyword-editor"]'
    );

  editor
    .classList
    .remove("open");

};

window.toggleCardTag =
function(btn){

  btn.classList
    .toggle("active");

};

window.saveKeywords =
async function(
  btn,
  id
){

  const editor =
    btn.closest(
      '[data-role="keyword-editor"]'
    );

  const tags =
    [
      ...editor
        .querySelectorAll(
          ".mini-tag-btn.active"
        )
    ].map(
      x =>
        x.dataset.tag
    );

  btn.disabled =
    true;

  btn.textContent =
    "저장 중…";

  const {
    error
  } =
    await sb
      .from(TABLE)
      .update({
        tags
      })
      .eq(
        "id",
        id
      );

  if(error){

    console.error(
      error
    );

    alert(
      "키워드를 저장하지 못했습니다. Supabase UPDATE 정책을 확인해 주세요."
    );

    btn.disabled =
      false;

    btn.textContent =
      "저장";

    return;

  }

  await loadItems();

};

window.openModal =
function(src){

  el("modalImg").src =
    src;

  el("modal")
    .classList
    .add("open");

};

function closeModal(){

  el("modal")
    .classList
    .remove("open");

  el("modalImg").src =
    "";

}

document.addEventListener(
  "paste",
  async e => {

    const files =
      [
        ...e
          .clipboardData
          .items
      ]
        .filter(
          i =>
            i.kind ===
            "file"
        )
        .map(
          i =>
            i.getAsFile()
        )
        .filter(Boolean);

    if(files.length){

      e.preventDefault();

      pendingFiles =
        files;

      setStatus(
        `붙여넣은 파일 ${pendingFiles.length}개 선택됨`
      );

      await uploadFiles(
        files
      );

    }

  }
);

[
  "dragenter",
  "dragover"
].forEach(
  evt =>
    dropzone
      .addEventListener(
        evt,
        e => {

          e.preventDefault();

          dropzone
            .classList
            .add("drag");

        }
      )
);

[
  "dragleave",
  "drop"
].forEach(
  evt =>
    dropzone
      .addEventListener(
        evt,
        e => {

          e.preventDefault();

          dropzone
            .classList
            .remove("drag");

        }
      )
);

dropzone.addEventListener(
  "drop",
  e => {

    pendingFiles =
      [
        ...e
          .dataTransfer
          .files
      ];

    setStatus(
      `드롭한 파일 ${pendingFiles.length}개 선택됨`
    );

    uploadFiles(
      pendingFiles
    );

  }
);

dropzone.addEventListener(
  "click",
  () =>
    fileInput.click()
);

fileInput.addEventListener(
  "change",
  () => {

    pendingFiles =
      [
        ...fileInput.files
      ];

    setStatus(
      `선택된 파일 ${pendingFiles.length}개`
    );

  }
);

el("cameraBtn")
  .addEventListener(
    "click",
    () =>
      cameraInput.click()
  );

cameraInput
  .addEventListener(
    "change",
    () => {

      const files =
        [
          ...cameraInput.files
        ];

      if(files.length){

        pendingFiles =
          files;

        setStatus(
          "촬영한 사진 1개 선택됨"
        );

        uploadFiles(
          files
        );

      }

    }
  );

el("uploadBtn")
  .addEventListener(
    "click",
    () => {

      if(
        fileInput.files
          ?.length
      ){

        uploadFiles(
          [
            ...fileInput.files
          ]
        );

      }else if(
        pendingFiles.length
      ){

        uploadFiles(
          pendingFiles
        );

      }else{

        fileInput.click();

      }

    }
  );

el("addNameBtn")
  .addEventListener(
    "click",
    addName
  );

el("refreshBtn")
  .addEventListener(
    "click",
    loadItems
  );

el("filters")
  .addEventListener(
    "click",
    e => {

      if(
        !e.target
          .matches(".pill")
      ){
        return;
      }

      activeFilter =
        e.target.dataset.filter;

      renderFilters();

      render();

    }
  );

el("tagBar")
  .addEventListener(
    "click",
    e => {

      if(
        !e.target
          .matches(".tag-btn")
      ){
        return;
      }

      toggleTag(
        e.target.dataset.tag
      );

    }
  );

el("modalClose")
  .addEventListener(
    "click",
    closeModal
  );

el("modal")
  .addEventListener(
    "click",
    e => {

      if(
        e.target.id ===
        "modal"
      ){
        closeModal();
      }

    }
  );

document.addEventListener(
  "keydown",
  e => {

    if(
      e.key ===
      "Escape"
    ){
      closeModal();
    }

  }
);

renderNameOptions();
renderTagButtons();
renderFilters();
loadItems();

</script>

</body>
</html>
